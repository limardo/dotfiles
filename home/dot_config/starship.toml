# Get editor completions based on the dot_config schema
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
command_timeout = 1000

[aws]
symbol = "  "
format   = "[$symbol($profile)(\\($region\\))]($style) "

[azure]
disabled = false
format   = "[$symbol($subscription)]($style) "
symbol   = " "
[azure.subscription_aliases]
"Pagamento in base al consumo" = "Quality Monitoring"

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

