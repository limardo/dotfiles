# `sheldon` configuration file
# ----------------------------
#
# You can modify this file directly or you can use one of the following
# `sheldon` commands which are provided to assist in editing the dot_config file:
#
# - `sheldon add` to add a new plugin to the dot_config file
# - `sheldon edit` to open up the dot_config file in the default editor
# - `sheldon remove` to remove a plugin from the dot_config file
#
# See the documentation for more https://github.com/rossmacarthur/sheldon#readme

shell = "zsh"

[templates]
defer = "{{ hooks?.pre | nl }}{% for file in files %}zsh-defer source \"{{ file }}\"\n{% endfor %}{{ hooks?.post | nl }}"

[plugins]

[plugins.zsh-defer]
github = "romkatv/zsh-defer"

[plugins.zsh-completions]
github = "zsh-users/zsh-completions"
dir    = "src"
apply  = ["fpath"]

[plugins.zsh-autosuggestions]
github = "zsh-users/zsh-autosuggestions"
use    = ["{{ name }}.zsh"]

[plugins.zsh-autosuggestions.hooks]
pre = '''
ZSH_AUTOSUGGEST_STRATEGY=(history completion)
ZSH_AUTOSUGGEST_BUFFER_MAX_SIZE=50
'''

[plugins.zsh-syntax-highlighting]
github = "zsh-users/zsh-syntax-highlighting"
apply  = ["defer"]

[plugins.zsh-history-substring-search]
github = "zsh-users/zsh-history-substring-search"

[plugins.zsh-history-substring-search.hooks]
post = """
bindkey '^[[A' history-substring-search-up
bindkey '^[[B' history-substring-search-down
"""

[plugins.fzf]
inline = """
export FZF_DEFAULT_COMMAND='rg --files --hidden --follow --glob "!.git"'
export FZF_CTRL_T_COMMAND="$FZF_DEFAULT_COMMAND"
export FZF_ALT_C_COMMAND='fd --type d --hidden --follow --exclude .git'
source <(fzf --zsh)
"""

[plugins.starship]
inline = 'eval "$(starship init zsh)"'
 
[plugins.atuin]
inline = 'eval "$(atuin init zsh --disable-up-arrow)"'
 
[plugins.zoxide]
inline = 'eval "$(zoxide init zsh --cmd cd)"'
 
[plugins.direnv]
inline = 'eval "$(direnv hook zsh)"'

[plugins.mise]
inline = 'eval "$(mise activate zsh --shims)"'

[plugins.zsh-which-key]
local = "~/.config/zsh/zsh-which-key"
use   = ["{{ name }}.plugin.zsh"]

[plugins.zsh-claudecode-completion]
github = "wbingli/zsh-claudecode-completion"
apply  = ["fpath"]

