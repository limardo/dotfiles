# ── Prefix: Ctrl+A (handier than Ctrl+B) ─────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ───────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on

# ── Intuitive splits ──────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Pane navigation with Alt+arrow (no prefix) ───────────────
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# ── Pane resize with Shift+arrow ──────────────────────────────
bind -n S-Left  resize-pane -L 5
bind -n S-Right resize-pane -R 5
bind -n S-Up    resize-pane -U 5
bind -n S-Down  resize-pane -D 5

# ── Reload config ─────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "Config ricaricata!"

# ── Status bar — Catppuccin Mocha ────────────────────────────
set -g status-position bottom
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left  "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] "
set -g status-right "#[fg=#6c7086] %d %b %H:%M "
set -g status-left-length 30
set -g window-status-current-format "#[bg=#313244,fg=#89b4fa,bold] #I #W "
set -g window-status-format         "#[fg=#6c7086] #I #W "
set -g pane-border-style            "fg=#313244"
set -g pane-active-border-style     "fg=#89b4fa"
set -g message-style                "bg=#313244,fg=#cdd6f4"

# ── Plugin Manager (TPM) ─────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'off'
set -g @resurrect-capture-pane-contents 'on'

run '~/.tmux/plugins/tpm/tpm'
