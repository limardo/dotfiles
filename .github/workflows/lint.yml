name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CHEZMOI_VERSION: v2.74.2
  PRE_COMMIT_VERSION: 4.7.0

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # scripts/check_templates.sh renders the templates with chezmoi and
      # checks the rendered .zshrc with zsh -n.
      - name: Install chezmoi and zsh
        run: |
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "${HOME}/.local/bin" -t "${CHEZMOI_VERSION}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh

      - run: pipx run "pre-commit==${PRE_COMMIT_VERSION}" run --all-files --show-diff-on-failure
