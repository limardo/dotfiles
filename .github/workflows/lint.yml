name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CHEZMOI_VERSION: v2.74.2

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        machine_type: [personal, work]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install chezmoi
        run: |
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "${HOME}/.local/bin" -t "${CHEZMOI_VERSION}"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      # make lint renders the script templates with chezmoi: it needs a config
      # with the data a real machine would have.
      - name: Configure chezmoi
        env:
          MACHINE_TYPE: ${{ matrix.machine_type }}
        run: |
          chezmoi init --source="${GITHUB_WORKSPACE}" \
            --promptChoice "machine_type=${MACHINE_TYPE}" \
            --promptString git_email=ci@example.invalid

      - run: make lint
