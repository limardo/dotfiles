# Checks run by git before each commit. Enable once per clone:
#   pre-commit install
# Run on the whole repo: pre-commit run --all-files

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 2ca41cc1372d1e939a6a879f18cdc19fc1cac1ce  # frozen: v8.30.0
    hooks:
      - id: gitleaks

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: 479be5958357ba5ab65ce47172117348516860e9  # frozen: v3.14.1-1
    hooks:
      - id: shfmt
        # Google Shell Style: 2-space indent, indented case, | at line start.
        args: [-w, -i, "2", -ci, -bn]
        exclude_types: [zsh]

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: 23eab0f0eedcbedebff420f5fdfb284744adc7b3  # frozen: v0.9.3
    hooks:
      - id: taplo-lint
        # No catalog (the default one fails to load). A file's own "$schema"
        # is still applied: starship.toml is checked against starship.rs,
        # which needs network.
        args: [--no-schema]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 81d3af62ea96a1f69f0cfa8745f253d3c4740896  # frozen: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck (make lint)
        entry: make lint
        language: system
        files: \.(sh|sh\.tmpl)$
        pass_filenames: false

      - id: templates
        name: chezmoi templates (both machine types)
        entry: scripts/check_templates.sh
        language: system
        files: \.tmpl$
        pass_filenames: false

      - id: no-git-email
        name: no git user.email in the repo
        entry: scripts/check_email.sh
        language: system
        types: [text]
